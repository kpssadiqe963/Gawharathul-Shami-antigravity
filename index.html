<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Malhama Gawharat Al-sham - Premium quality fresh meat">
    <title>ملحمة جوهرة الشامي | Malhama Gawharat Al-sham</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="light-mode">
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <img src="images/logo.jpg" alt="Logo" id="logo-img" onerror="this.src='https://via.placeholder.com/200x80?text=Logo'">
            </div>
            <ul class="nav-links">
                <li><a href="#about" data-i18n="navAbout">About Us</a></li>
                <li><a href="#branches" data-i18n="navBranches">Branches</a></li>
                <li><a href="#contact" data-i18n="navContact">Contact Us</a></li>
            </ul>
            <div class="controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="lang-toggle" class="lang-btn" aria-label="Toggle Language">
                    EN
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1 class="hero-title" data-i18n="heroTitle">ملحمة جوهرة الشامي</h1>
            <p class="hero-subtitle" data-i18n="heroSubtitle">حاشي - خروف - بتالو</p>
        </div>
    </header>

    <!-- About Section -->
    <section id="about" class="about section">
        <div class="container">
            <h2 class="section-title" data-i18n="aboutTitle">من نحن</h2>
            <p class="about-text" id="about-text"></p>
        </div>
    </section>

    <!-- Showrooms Section -->
    <section id="branches" class="showrooms section bg-secondary">
        <div class="container">
            <h2 class="section-title" data-i18n="showroomsTitle">فروعنا</h2>
            <div class="grid" id="showrooms-grid">
                <!-- Showrooms will be injected here via JS -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact section">
        <div class="container">
            <h2 class="section-title" data-i18n="contactTitle">تواصل معنا</h2>
            <div class="contact-info">
                <p data-i18n="contactDesc">للإستفسارات والطلبات، يرجى التواصل معنا على الرقم الموحد:</p>
                <div class="contact-number" dir="ltr">
                    <a href="tel:+966555691266"><i class="fas fa-phone-alt"></i> +966 55 569 1266</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p data-i18n="footerText">© 2026 ملحمة جوهرة الشامي. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
