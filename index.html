<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Malhama Gawharat Al-sham - Premium quality fresh meat">
    <title>ملحمة جوهرة الشامي | Malhama Gawharat Al-shami</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="light-mode">
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <img src="images/logo.jpg" alt="Logo" id="logo-img" onerror="this.src='https://via.placeholder.com/200x80?text=Logo'">
            </div>
            <ul class="nav-links">
                <li><a href="#about" data-i18n="navAbout">من نحن</a></li>
                <li><a href="#branches" data-i18n="navBranches">فروعنا</a></li>
                <li><a href="#gallery" data-i18n="navGallery">المعرض</a></li>
                <li><a href="#contact" data-i18n="navContact">تواصل معنا</a></li>
            </ul>
            <div class="controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="lang-toggle" class="lang-btn" aria-label="Toggle Language">
                    EN
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <!-- To change the header photo: add a file named "header.jpg" into the "images" folder and it will automatically appear here -->
    <header class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1 class="hero-title" data-i18n="heroTitle">ملحمة جوهرة الشامي</h1>
            <p class="hero-subtitle" data-i18n="heroSubtitle">حاشي - خروف - بتالو</p>
        </div>
    </header>

    <!-- About Section -->
    <section id="about" class="about section">
        <div class="container">
            <h2 class="section-title" data-i18n="aboutTitle">من نحن</h2>

            <!-- Stats Row -->
            <div class="about-stats">
                <div class="stat-card">
                    <span class="stat-num">25+</span>
                    <span class="stat-label" id="stat1Label"></span>
                </div>
                <div class="stat-card">
                    <span class="stat-num">5</span>
                    <span class="stat-label" id="stat2Label"></span>
                </div>
                <div class="stat-card">
                    <span class="stat-num"><i class="fas fa-check-circle"></i></span>
                    <span class="stat-label" id="stat3Label"></span>
                </div>
            </div>

            <!-- Description Text -->
            <div class="about-body">
                <p class="about-p" id="about-p1"></p>
                <p class="about-p" id="about-p2"></p>
            </div>

            <!-- Meat Type Badges -->
            <div class="meat-badges">
                <div class="meat-badge">
                    <span class="meat-icon">🐪</span>
                    <span id="meat1"></span>
                </div>
                <div class="meat-badge">
                    <span class="meat-icon">🐑</span>
                    <span id="meat2"></span>
                </div>
                <div class="meat-badge">
                    <span class="meat-icon">🐄</span>
                    <span id="meat3"></span>
                </div>
            </div>

            <!-- Tagline -->
            <p class="about-tagline" id="about-tagline"></p>
        </div>
    </section>

    <!-- Showrooms Section -->
    <section id="branches" class="showrooms section bg-secondary">
        <div class="container">
            <h2 class="section-title" data-i18n="showroomsTitle">فروعنا</h2>
            <div class="grid" id="showrooms-grid">
                <!-- Showrooms will be injected here via JS -->
            </div>
        </div>
    </section>

    <!-- Gallery Section -->
    <!--
        HOW TO ADD PHOTOS TO THE GALLERY:
        1. Save your photos inside the "images/gallery/" folder.
        2. Name them: gallery1.jpg, gallery2.jpg, gallery3.jpg, etc.
        3. Update the list in js/gallery.js by adding or removing image file names.
        That's it! Refresh the page and they will appear automatically.
    -->
    <section id="gallery" class="gallery section">
        <div class="container">
            <h2 class="section-title" data-i18n="galleryTitle">المعرض</h2>
            <div class="gallery-grid" id="gallery-grid">
                <!-- Gallery images injected by JS -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact section bg-secondary">
        <div class="container">
            <h2 class="section-title" data-i18n="contactTitle">تواصل معنا</h2>
            <div class="contact-info">
                <p data-i18n="contactDesc">للإستفسارات والطلبات، يرجى التواصل معنا على الرقم الموحد:</p>
                <div class="contact-number" dir="ltr">
                    <a href="tel:+966593374993"><i class="fas fa-phone-alt"></i> +966 59 337 4993</a>
                </div>
                <div class="contact-actions">
                    <a href="tel:+966593374993" class="btn btn-primary">
                        <i class="fas fa-phone"></i>
                        <span data-i18n="callBtn">إتصال</span>
                    </a>
                    <a href="https://wa.me/966593374993" target="_blank" class="btn btn-whatsapp">
                        <i class="fab fa-whatsapp"></i>
                        <span>WhatsApp</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p data-i18n="footerText">© 2026 ملحمة جوهرة الشامي. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
